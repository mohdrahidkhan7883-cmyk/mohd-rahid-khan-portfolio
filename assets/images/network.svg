<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 900 700"
    width="900"
    height="700"
    fill="none">

    <defs>

        <!-- Cyan Glow -->

        <filter
            id="cyanGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

            <feGaussianBlur
                stdDeviation="3"
                result="blur"/>

            <feMerge>

                <feMergeNode in="blur"/>

                <feMergeNode in="SourceGraphic"/>

            </feMerge>

        </filter>

        <!-- Strong Glow -->

        <filter
            id="cyanGlowStrong"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

            <feGaussianBlur
                stdDeviation="6"
                result="blur"/>

            <feMerge>

                <feMergeNode in="blur"/>

                <feMergeNode in="SourceGraphic"/>

            </feMerge>

        </filter>

    </defs>

    <!-- ===========================
         NETWORK STARTS HERE
    ============================ -->
<!-- =====================================
     CLUSTER 1 (TOP RIGHT)
====================================== -->

<g id="cluster-top-right" opacity="0.85">

    <!-- Lines -->

    <line x1="640" y1="40" x2="720" y2="90"
          stroke="#22D3EE"
          stroke-width="1.1"
          stroke-opacity=".30"/>

    <line x1="720" y1="90" x2="810" y2="55"
          stroke="#22D3EE"
          stroke-width="1.1"
          stroke-opacity=".25"/>

    <line x1="720" y1="90" x2="760" y2="170"
          stroke="#22D3EE"
          stroke-width="1"
          stroke-opacity=".25"/>

    <line x1="810" y1="55" x2="860" y2="135"
          stroke="#22D3EE"
          stroke-width="1"
          stroke-opacity=".25"/>

    <line x1="760" y1="170" x2="860" y2="135"
          stroke="#22D3EE"
          stroke-width="1"
          stroke-opacity=".25"/>

    <line x1="760" y1="170" x2="700" y2="250"
          stroke="#22D3EE"
          stroke-width="1"
          stroke-opacity=".22"/>

    <line x1="700" y1="250" x2="820" y2="250"
          stroke="#22D3EE"
          stroke-width="1"
          stroke-opacity=".22"/>

    <line x1="820" y1="250" x2="860" y2="135"
          stroke="#22D3EE"
          stroke-width="1"
          stroke-opacity=".20"/>


    <!-- Nodes -->

    <circle cx="640" cy="40"
            r="3"
            fill="#22D3EE"
            filter="url(#cyanGlowStrong)"/>

    <circle cx="720" cy="90"
            r="4"
            fill="#22D3EE"
            filter="url(#cyanGlowStrong)"/>

    <circle cx="810" cy="55"
            r="3"
            fill="#22D3EE"
            filter="url(#cyanGlowStrong)"/>

    <circle cx="860" cy="135"
            r="4"
            fill="#22D3EE"
            filter="url(#cyanGlowStrong)"/>

    <circle cx="760" cy="170"
            r="5"
            fill="#22D3EE"
            filter="url(#cyanGlowStrong)"/>

    <circle cx="700" cy="250"
            r="3"
            fill="#22D3EE"
            filter="url(#cyanGlowStrong)"/>

    <circle cx="820" cy="250"
            r="4"
            fill="#22D3EE"
            filter="url(#cyanGlowStrong)"/>

</g>
